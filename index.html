<style>
/* Layout: one livehouse stage fitted to the viewport (16:9 横画面 / 9:16 スマホ縦画面), big thumb button underneath. Single dark look (it's a live venue). */
:root{
  --bg:#0d0913;
  --panel:#1a1224;
  --fg:#f3ecf8;
  --muted:#a698b5;
  --accent:#ff4f9a;
  --accent-ink:#2a0716;
  --line:#3a2b4a;
  --gold:#ffe46b;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--f-body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  box-sizing:border-box;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
#stage{
  width:min(100%, calc((100dvh - 150px) * 16 / 9), 1200px);
  max-width:100%;aspect-ratio:16/9;position:relative;
}
#stage.portrait{width:min(100%, calc((100dvh - 100px) * 9 / 16), 560px);aspect-ratio:9/16}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:10px;background:#000;touch-action:none;
  box-shadow:0 0 0 1px var(--line),0 18px 60px rgba(255,79,154,.12);cursor:pointer}
#controls{display:flex;gap:10px;width:min(100%, 560px)}
#look{
  flex:1;font:800 20px/1 var(--f-body);color:var(--accent-ink);background:var(--accent);
  border:0;border-radius:999px;padding:16px 20px;cursor:pointer;touch-action:none;
  box-shadow:0 5px 0 #a3245f;transition:transform .05s, box-shadow .05s;
}
#look:active{transform:translateY(4px);box-shadow:0 1px 0 #a3245f}
#look kbd{font:500 12px/1 var(--f-body);background:rgba(0,0,0,.15);border-radius:6px;padding:4px 6px;margin-left:8px;vertical-align:middle}
/* リザルトの上に重ねる HTML（チェキ・シェア） */
#ov{position:absolute;inset:0;pointer-events:none;font-family:var(--f-body)}
#ov>*{pointer-events:auto}
#ov [hidden]{display:none!important}
#resBar{position:absolute;left:2%;bottom:3%;width:46%;display:grid;gap:6px;justify-items:center}
#stage.portrait #resBar{top:3%;bottom:auto;left:50%;right:auto;transform:translateX(-50%);width:94%}
#resMsg{margin:0;font:800 clamp(11px,1.35vw,14px)/1.4 var(--f-body);color:var(--gold);text-align:center;text-shadow:0 1px 0 #000,0 0 6px #000;text-wrap:balance}
#stage.portrait #resMsg{font-size:clamp(12px,3.4vw,15px)}
.resRow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.resRow a,.resRow button{font:800 clamp(11px,1.2vw,13px)/1 var(--f-body);border-radius:999px;padding:8px 12px;cursor:pointer;text-decoration:none;border:1.5px solid var(--line);background:var(--panel);color:var(--fg);white-space:nowrap}
#stage.portrait .resRow a,#stage.portrait .resRow button{font-size:clamp(12px,3.3vw,14px);padding:9px 13px}
#shareX,#shareX2{background:#f3ecf8;color:#0d0913;border-color:#f3ecf8}
#openCheki{white-space:nowrap;position:absolute;left:27%;top:60%;transform:translate(-50%,-50%);font:800 clamp(16px,2.6vw,26px)/1 var(--f-body);padding:.7em 1.4em;border-radius:999px;background:var(--gold);color:#2a1a06;border:3px solid #2a1a06;box-shadow:0 5px 0 #a3832a,0 0 24px rgba(255,228,107,.6);cursor:pointer;animation:chekiPulse 1.1s ease-in-out infinite}
#stage.portrait #openCheki{left:50%;top:50%;font-size:clamp(18px,5.5vw,26px)}
#openCheki::before{content:"";display:inline-block;width:.9em;height:1.05em;margin-right:.45em;vertical-align:-.15em;background:#fff;border:2px solid #2a1a06;border-bottom-width:.3em;border-radius:2px;transform:rotate(-8deg)}
@keyframes chekiPulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
#chekiClose.wait{visibility:hidden}
@media (prefers-reduced-motion:reduce){#openCheki{animation:none}}
#tipBtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#chekiModal{position:absolute;inset:0;background:rgba(10,6,16,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5%;padding:2%;box-sizing:border-box;overflow:hidden}
#chekiModal[hidden]{display:none}
#bookModal{position:absolute;inset:0;background:rgba(10,6,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;padding:3%;box-sizing:border-box;overflow:hidden}
#bookModal h3{margin:0;font:800 clamp(18px,2.6vw,26px)/1.2 var(--f-body);color:var(--gold)}
#bookGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2%;width:94%;max-width:640px}
.bk{position:relative;aspect-ratio:3/4;border:3px solid var(--c);border-radius:6px;background:#221731;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--fg)}
.bk img{width:100%;height:100%;object-fit:cover;display:block}
.bk .q{font:800 clamp(18px,4vw,30px)/1 var(--f-body);color:var(--c);opacity:.6}
.bk .nm{position:absolute;left:0;right:0;bottom:0;font:800 clamp(9px,2.4vw,12px)/1.6 var(--f-body);background:rgba(10,6,16,.75);color:var(--c);text-align:center}
.bk .deco{position:absolute;top:2px;right:2px;font:800 clamp(8px,2vw,11px)/1 var(--f-body);background:var(--gold);color:#2a1a06;border-radius:999px;padding:3px 5px}
#bookGroup{display:grid;grid-template-columns:1fr 1fr;gap:3%;width:94%;max-width:640px}
.bg{position:relative;aspect-ratio:16/10;border:3px solid var(--gold);border-radius:8px;background:#221731;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--fg);font:800 clamp(10px,2.6vw,13px)/1.4 var(--f-body);text-align:center}
.bg img{width:100%;height:100%;object-fit:cover;display:block}
.bg.lock{border-color:var(--line);color:var(--muted);cursor:default}
.bg .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(10,6,16,.75);color:var(--gold);font-size:clamp(9px,2.4vw,12px)}
#bookHint{margin:0;font:800 clamp(11px,3vw,14px)/1.5 var(--f-body);color:var(--fg);text-align:center;text-wrap:balance;max-width:94%}
#bookClose,#bookViewClose{font:800 15px/1 var(--f-body);border-radius:999px;padding:10px 26px;background:var(--panel);color:var(--fg);border:1.5px solid var(--line);cursor:pointer}
#bookView{position:absolute;inset:0;background:rgba(10,6,16,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%}
#bookImg{max-width:92%;max-height:78%;object-fit:contain;transform:rotate(-2deg);box-shadow:0 12px 30px rgba(0,0,0,.6)}
#cardModal{position:absolute;inset:0;background:rgba(10,6,16,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5%;padding:2%;box-sizing:border-box;overflow:hidden}
#cardModal h3{margin:0;font:800 clamp(14px,2vw,20px)/1.2 var(--f-body);color:var(--gold)}
#cardImg{flex:0 1 auto;min-height:0;max-height:72%;max-width:86%;object-fit:contain;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#cardModal p{margin:0;font:800 clamp(11px,1.4vw,14px)/1.4 var(--f-body);color:var(--fg);text-align:center}
#cardBtn,#copyCard{background:var(--gold);color:#2a1a06;border-color:var(--gold)}
#stage.portrait #cardModal p{font-size:clamp(12px,3.4vw,15px)}
#chekiModal h3{margin:0;font:800 clamp(15px,2.2vw,24px)/1.2 var(--f-body);color:var(--gold);text-shadow:0 2px 0 #000;text-align:center}
#chekiImg{flex:0 1 auto;min-height:0;max-height:64%;max-width:80%;object-fit:contain;height:auto;width:auto;transform:rotate(-3deg);box-shadow:0 12px 30px rgba(0,0,0,.6);animation:chekiIn .6s cubic-bezier(.2,1.4,.4,1) both}
#stage:not(.portrait) #chekiImg{max-height:68%}
#chekiNext{margin:0;font:800 clamp(11px,1.4vw,14px)/1.4 var(--f-body);color:var(--fg);text-align:center;text-wrap:balance;max-width:90%}
#chekiClose{font:800 14px/1 var(--f-body);border-radius:999px;padding:9px 22px;background:var(--panel);color:var(--fg);border:1.5px solid var(--line);cursor:pointer}
@keyframes chekiIn{from{transform:translateY(-40px) rotate(-12deg) scale(.7);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@media (prefers-reduced-motion:reduce){#chekiImg{animation:none}}
#mute{font:800 14px/1 var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 16px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.note{margin:0;font-size:12px;color:var(--muted);text-align:center;max-width:62ch;text-wrap:balance}
@media (max-width:560px){ #look{font-size:18px;padding:14px} #look kbd{display:none} }
/* スマホ縦画面：ゲーム画面を全面に。下を向く操作は画面タップ、ミュートだけ右下に浮かせる */
@media (orientation:portrait) and (max-width:700px){
  body{padding:0;gap:0}
  #stage,#stage.portrait{width:100%;height:100%;max-width:none;aspect-ratio:auto}
  #cv{border-radius:0;box-shadow:none}
  .note,#look{display:none}
  #controls{position:fixed;width:auto;z-index:2;
    right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
  #mute{padding:10px 14px;background:rgba(26,18,36,.8)}
  body.in-result #controls{display:none}
}
</style>

<div id="stage"><canvas id="cv" aria-label="後方彼氏面 ゲーム画面"></canvas>
  <div id="ov">
    <div id="resBar" hidden>
      <p id="resMsg"></p>
      <div class="resRow">
        <button id="cardBtn" type="button">結果カード（画像）</button>
        <a id="shareX" href="#" target="_blank" rel="noopener">Xでシェア</a>
        <button id="copyRes" type="button">結果をコピー</button>
        <a id="tipBtn" href="#" target="_blank" rel="noopener" hidden>制作者を応援する</a>
      </div>
    </div>
    <button id="openCheki" type="button" hidden>チェキを見る</button>
    <div id="bookModal" hidden>
      <h3>チェキ帳</h3>
      <div id="bookGrid"></div>
      <div id="bookGroup"></div>
      <p id="bookHint"></p>
      <button id="bookClose" type="button">閉じる</button>
      <div id="bookView" hidden><img id="bookImg" alt=""><button id="bookViewClose" type="button">もどる</button></div>

      <div class="resRow"><button id="copyCard" type="button">画像をコピー</button><a id="shareX2" href="#" target="_blank" rel="noopener">Xでシェア</a><button id="cardClose" type="button">閉じる</button></div>

</div>
<div id="controls">
  <button id="look" type="button">下を向く<kbd>SPACE</kbd></button>
  <button id="mute" type="button" aria-label="音のオン・オフ">♪ ON</button>
</div>
<p class="note">推しのリングが顔の円に重なる瞬間に下を向いてレスを回避。他メンバーのレスは受けてOK。PC は Space / ↓、スマホは画面かボタンをタップ。M でミュート。</p>

<script>
(()=>{
'use strict';
const PI=Math.PI, TAU=PI*2;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stageEl=document.getElementById('stage');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3)};
const R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)];
function seeded(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

const OL='#1a1220', SKIN='#efc39b', SKIN_D='#d29b72', JEANS='#2d3f6b', TEE='#e6e0d0', SKIN_I='#ffe0cc';
const FD='"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif';
const FR='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

// ================= メンバー =================
const BASE_MEMBERS=[
  {style:'twin',name:'るる',eye:'#c2306f',col:'#ff4f9a',dress:'#ff6fae',dress2:'#ff93c4',hair:'#6b3a52',bow:'#e8285f',lv:1},
  {style:'long',name:'みお',eye:'#2f6fd0',col:'#4fb8ff',dress:'#5aa9ff',dress2:'#8cc6ff',hair:'#2f3550',bow:'#1f6fd1',lv:2},
  {style:'side',name:'ひなた',eye:'#c8741c',col:'#ffd23f',dress:'#ffc94a',dress2:'#ffe08a',hair:'#a0602a',bow:'#ff8a1f',lv:4},
  {style:'buns',name:'ゆめ',eye:'#7a4fd0',col:'#b77dff',dress:'#a77bff',dress2:'#c9a8ff',hair:'#ece6f4',bow:'#7a3fe0',lv:6},
  {style:'bob',name:'わかば',eye:'#2f9a5a',col:'#5fe08a',dress:'#4fd17d',dress2:'#8eeaae',hair:'#3a2a20',bow:'#1f9a4c',lv:8},
];
// 推しは常に先頭（センター・最初からいる）。残りはレベルで加入
const SLOT_LV=[1,2,4,6,8];
let oshiIdx=0,MEMBERS=[];
function setOshi(k){
  oshiIdx=k;
  MEMBERS=[BASE_MEMBERS[k],...BASE_MEMBERS.filter((_,i)=>i!==k)].map((m,i)=>Object.assign({},m,{lv:SLOT_LV[i]}));
  try{localStorage.setItem('kohoKareshi.oshi',String(k))}catch(e){}
}
try{oshiIdx=clamp(Math.floor(+localStorage.getItem('kohoKareshi.oshi')||0),0,4)}catch(e){}
setOshi(oshiIdx);
const TAG_ANG=[-PI*0.78,-PI*0.22,PI*0.8,PI*0.2,-PI*0.5];

// ================= レイアウト（横 / 縦） =================
const LAYOUTS={
  land:{portrait:false,W:960,H:540,otX:812,ground:528,runTo:{x:-160,y:528,s:1},
    idolY:306,slots:[190,95,290,40,345],idolS:[1.25,1.08,1.08,1.08,1.08],
    led:[24,44,330,170],trussW:700,lights:10,speakers:[[402,40],[600,40]],
    stage:{w:382,lip:16,top:298,front:318,bottom:348},monitors:[110,270],floorY:330,
    wall:[705,0,255,500],
    posters:[[728,84,62,86,'#ff6fae',-0.06,'oshi'],[868,74,66,92,'#5fd0ff',0.05,'live'],[744,300,54,74,'#ffe15f',0.04,'goods'],[886,318,56,76,'#b98aff',-0.05,'taiban']],
    exit:[878,28],fans:{n:32,x0:280,x1:685,y0:352,y1:488,s0:0.62,s1:1.1},lucky:[322,378,0.74],fanAim:-PI/2-0.55,
    beams:[60,200,340,520,640],telX:652,hud:[398,44,300],hint:[510,476],cx:480,cy:262,gw:330,lvY:150,resultOt:[330,488,0.5]},
};
// 縦画面は高さ可変（9:16〜細長いスマホ）。増えた高さは客席と後方の壁に配分し、主人公は常に下端に立つ
function makePort(H){
  const d=H-960,c=Math.round(d*0.55);
  return{key:'p'+H,portrait:true,W:540,H,otX:282,ground:944+d,runTo:{x:230,y:480+c*0.5,s:0.42},
    idolY:392,slots:[270,152,388,52,488],idolS:[1.45,1.25,1.25,1.25,1.25],
    led:[22,80,496,196],trussW:540,lights:8,speakers:[],
    stage:{w:540,lip:0,top:384,front:402,bottom:436},monitors:[150,390],floorY:436,
    wall:[0,604+c,540,326+d-c],
    posters:[[26,640,62,86,'#ff6fae',-0.06,'oshi'],[452,700,66,92,'#5fd0ff',0.05,'live'],[40,790,54,74,'#ffe15f',0.04,'goods'],[466,830,56,76,'#b98aff',-0.05,'taiban']]
      .map(p=>{const q=p.slice();q[1]+=c+(p[1]>=780?Math.round((d-c)*0.7):0);return q}),
    exit:[452,620+c],fans:{n:30+Math.round(c/12),x0:30,x1:510,y0:476,y1:596+c,s0:0.72,s1:1.0+c/500},lucky:[232,474,0.72],fanAim:-PI/2-0.2,
    beams:[40,160,280,400,500],telX:470,hud:[20,24,500],cx:270,cy:470+Math.round(c*0.5),gw:300,lvY:360+Math.round(c*0.5),hint:[270,566+Math.round(c*0.5)],resultOt:[140,520+Math.round(c*0.6),0.5],resultY:574+d};
}
LAYOUTS.land.key='l';
const FULL_MQ=window.matchMedia('(orientation:portrait) and (max-width:700px)');
const LEAN=0.06, TARGET_R=42, RING_SPAN=172;
let L=null,W=960,H=540,FACE={x:0,y:0},GAUGE={x:0,y:0},HANDS=[],FANS=[],LUCKY=null;
function genFans(){
  const f=L.fans,r=seeded(7),a=[];
  for(let i=0;i<f.n;i++){const y=f.y0+r()*(f.y1-f.y0),x=f.x0+r()*(f.x1-f.x0);
    a.push({x,y,s:f.s0+(y-f.y0)/(f.y1-f.y0)*(f.s1-f.s0),ph:r()*TAU,col:r()<0.68?null:['#5fd0ff','#ffe15f','#8aff7a','#c58aff'][Math.floor(r()*4)],faint:0})}
  LUCKY={x:L.lucky[0],y:L.lucky[1],s:L.lucky[2],ph:1.2,col:null,faint:0,lucky:true};
  a.push(LUCKY);a.sort((p,q)=>p.y-q.y);FANS=a;
}
function applyLayout(){
  const portrait=window.innerHeight>window.innerWidth*1.05;
  stageEl.classList.toggle('portrait',portrait);
  let h=960;
  if(portrait&&FULL_MQ.matches){const r=stageEl.getBoundingClientRect();if(r.width>0)h=clamp(Math.round(540*r.height/r.width),960,1320)}
  const key=portrait?'p'+h:'l';
  if(L&&L.key===key)return;
  L=portrait?makePort(h):LAYOUTS.land;W=L.W;H=L.H;
  FACE={x:L.otX+Math.sin(LEAN)*312,y:L.ground-Math.cos(LEAN)*312};
  GAUGE=FACE;
  HANDS=L.slots.map((x,i)=>({x:x+46*L.idolS[i],y:L.idolY-104*L.idolS[i]}));
  genFans();
}
let scale=1,offX=0,offY=0;
function resize(){
  applyLayout();
  const r=cv.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  scale=Math.min(cv.width/W,cv.height/H);
  offX=(cv.width-W*scale)/2;offY=(cv.height-H*scale)/2;
}
window.addEventListener('resize',resize);
resize();

// ================= 描画ヘルパ =================
function ell(x,y,rx,ry,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU)}
function rrPath(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function limb(pts,w,fill,olw=5){
  ctx.lineCap='round';ctx.lineJoin='round';
  const path=()=>{ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1])};
  if(olw){ctx.strokeStyle=OL;ctx.lineWidth=w+olw;path();ctx.stroke()}
  ctx.strokeStyle=fill;ctx.lineWidth=w;path();ctx.stroke();
}
// 太さのある腕を塗りつぶしで描く（パターンでの線描画はスマホのブラウザで黒くなることがある）
function limbP(pts,w,fill){
  const r=w/2;ctx.beginPath();
  for(let i=0;i<pts.length-2;i+=2){
    const x1=pts[i],y1=pts[i+1],x2=pts[i+2],y2=pts[i+3],a=Math.atan2(y2-y1,x2-x1),nx=-Math.sin(a)*r,ny=Math.cos(a)*r;
    ctx.moveTo(x1+nx,y1+ny);ctx.lineTo(x2+nx,y2+ny);ctx.arc(x2,y2,r,a+PI/2,a-PI/2,true);
    ctx.lineTo(x1-nx,y1-ny);ctx.arc(x1,y1,r,a-PI/2,a+PI/2,true);ctx.closePath();
  }
  ctx.lineJoin='round';ctx.strokeStyle=OL;ctx.lineWidth=5;ctx.stroke();
  ctx.fillStyle=fill;ctx.fill();
}
function heart(x,y,s){
  y-=s*0.25;
  ctx.beginPath();ctx.moveTo(x,y+s);
  ctx.bezierCurveTo(x+s*1.25,y+s*0.15,x+s*0.95,y-s*1.0,x,y-s*0.3);
  ctx.bezierCurveTo(x-s*0.95,y-s*1.0,x-s*1.25,y+s*0.15,x,y+s);
  ctx.closePath();
}
function star(x,y,r,rot=0){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*PI/5-PI/2,rr=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
function drop(x,y,s){ctx.beginPath();ctx.moveTo(x,y-s*1.6);ctx.quadraticCurveTo(x+s,y-s*0.2,x+s*0.8,y+s*0.3);ctx.arc(x,y+s*0.3,s*0.8,0,PI);ctx.quadraticCurveTo(x-s,y-s*0.2,x,y-s*1.6);ctx.closePath()}
function txt(s,x,y,size,col,o={}){
  ctx.font=`${o.weight||800} ${size}px ${o.font||FR}`;
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.base||'middle';
  if(o.olw){ctx.lineJoin='round';ctx.lineWidth=o.olw;ctx.strokeStyle=o.ol||OL;ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function bubble(text,x,y,tx,ty,o={}){
  const size=o.size||17;
  ctx.font=`800 ${size}px ${o.font||FR}`;
  const w=ctx.measureText(text).width+size*1.7,h=size+size*1.15;
  const bx=clamp(x-w/2,8,W-8-w),by=y-h;
  ctx.fillStyle=o.bg||'#fff';ctx.strokeStyle=OL;ctx.lineWidth=3;
  rrPath(bx,by,w,h,h/2);ctx.fill();ctx.stroke();

  ctx.beginPath();ctx.moveTo(ax-8,by+h-1.5);ctx.lineTo(tx,ty);ctx.lineTo(ax+8,by+h-1.5);ctx.fill();ctx.stroke();
  ctx.fillRect(ax-6.5,by+h-4,13,4);
  txt(text,bx+w/2,by+h/2+1,size,o.col||OL,{font:o.font});

}
function pill(label,x,y,bg,size=12){
  ctx.font=`800 ${size}px ${FR}`;const w=ctx.measureText(label).width+16,h=size+8;

function tone(at,f,dur,type,vol,dest=sfxBus,f2){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,at);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
  g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.006);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g);g.connect(dest);o.start(at);o.stop(at+dur+0.03);
}
function noise(at,dur,vol,ft,ff,dest=sfxBus){
  const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=ft;f.frequency.value=ff;
  const g=ac.createGain();g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  s.connect(f);f.connect(g);g.connect(dest);s.start(at,R()*0.5);s.stop(at+dur+0.03);
}
function kick(at,dest=musicBus,v=0.9){
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(42,at+0.13);
  g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(0.001,at+0.2);o.connect(g);g.connect(dest);o.start(at);o.stop(at+0.22);
}

function playStep(n,at){
  const bar=Math.floor(n/16)%4, st=n%16, ch=CHORDS[bar], root=ROOTS[bar], intro=n<32;
  if(st%4===0)kick(at);
  if(st===4||st===12)noise(at,0.15,0.32,'bandpass',1800,musicBus);
  if(st%4===2)noise(at,0.06,0.13,'highpass',7000,musicBus);
  else if(st%2===1)noise(at,0.03,0.05,'highpass',8000,musicBus);
  if(st%2===0)tone(at,root*(st%4===2?2:1),0.11,'triangle',0.32,musicBus);
  tone(at,ch[st%3]*((Math.floor(st/3)%2)?2:1),0.07,'square',0.022,musicBus);
  if(st===0)ch.forEach(f=>tone(at,f/2,BEAT*4,'sine',0.045,musicBus));
  if(!intro){const m=MELO[bar][st];if(m)tone(at,m,0.22,'square',0.035,musicBus)}
}

function mkEvent(o){return Object.assign({mem:0,feint:false,revealT:0,revealed:false,done:false,res:null,played:false,flinched:false},o)}

// 拍→時刻（いま流れている曲の拍グリッド）
const T=b=>curSeg.t0+curSeg.off+b*BEAT;
const segEnd=()=>curSeg.t0+curSeg.dur-1.2;
function genOshi(){
  const TF=0.4/BEAT;
  for(let guard=0;guard<8;guard++){
    const lv=dlv();
    const tele=Math.round(clamp(4.5-lv*0.3,1.75,4.5)*TF);
    if(T(nextHitBeat-tele*2.4)>gt+1||T(nextHitBeat)>segEnd())break;
    const r=R();
    let kind='single';
    if(lv>=3&&r<0.2)kind='feint';
    else if(lv>=4&&r<0.38)kind='double';
    else if(lv>=7&&r<0.5)kind='triple';
    else if(lv>=5&&r<0.64)kind='call';
    const type=kind==='call'?'call':pick(poolOf(0)),shout=shoutOf(0,type);
    const tb=kind==='call'?Math.max(2,Math.round(tele*0.6)):tele;
    const teleSec=tb*BEAT;
    const sp=Math.max(1,Math.round(1.5*TF));
    const beats=kind==='double'?[0,sp]:kind==='triple'?[0,sp,sp*2]:[0];
    // LV4 から、速いリングの中に遅いリング（予告が1.6〜2.4倍長い）が混ざる。着弾は同じ拍グリッドのまま
    const slowP=lv>=4?Math.min(0.4,0.08*(lv-3)):0;
    for(const b of beats){
      const hit=T(nextHitBeat+b);
      const ts=(kind!=='call'&&kind!=='feint'&&R()<slowP)?Math.round(tb*(1.6+R()*0.8))*BEAT:teleSec;
      events.push(mkEvent({type,shout,hit,start:hit-ts,tele:ts,feint:kind==='feint',revealT:hit-ts+ts*Math.min(0.74,0.55+lv*0.016)}));
    }
    let last=nextHitBeat+beats[beats.length-1];
    if(kind==='feint'&&lv>=6&&R()<0.5){
      const fb=Math.max(2,Math.round(2*TF)),hit=T(last+fb),ts=tele*BEAT;
      {const ty=pick(poolOf(0));events.push(mkEvent({type:ty,shout:shoutOf(0,ty),hit,start:hit-ts,tele:ts}))}
      last+=fb;
    }
    nextHitBeat=last+tele+Math.round(TF+R()*Math.max(1,4-lv*0.3)*TF);
  }
}
function genMembers(){
  const avail=[];for(let i=1;i<MEMBERS.length;i++)if(joined[i])avail.push(i);
  if(!avail.length)return;
  const TF=0.4/BEAT;
  for(let guard=0;guard<6;guard++){
    const lv=dlv(),tele=clamp(4.5-lv*0.3,1.75,4.5)*TF;
    if(nextMemBeat===0)nextMemBeat=Math.ceil((gt-curSeg.t0-curSeg.off)/BEAT+tele+3*TF);
    const tb=Math.round(tele);
    if(T(nextMemBeat-tele*2.4)>gt+1||T(nextMemBeat)>segEnd())break;
    let b=nextMemBeat;
    for(const e of events)if(e.mem===0&&Math.abs(e.hit-T(b))<0.3)b+=Math.ceil(TF);
    const hit=T(b),ts=(lv>=5&&R()<0.35?Math.round(tb*(1.6+R()*0.8)):tb)*BEAT;
    {const mi=pick(avail),ty=pick(poolOf(mi));events.push(mkEvent({type:ty,shout:shoutOf(mi,ty),mem:mi,hit,start:hit-ts,tele:ts}))}
    nextMemBeat=b+Math.round((Math.max(2.5,9-lv*0.45-avail.length*0.7)+R()*3)*TF);
  }
}

// 曲の時刻（いま耳に届いている位置）を performance.now() の時点 pms で求める
function songTimeAt(pms){
  if(songMode&&ac){
    if(ac.getOutputTimestamp){const ts=ac.getOutputTimestamp();if(ts&&ts.performanceTime>0)return ts.contextTime+(pms-ts.performanceTime)/1000-audioZero}
    return ac.currentTime-audioLat-audioZero-(performance.now()-pms)/1000;
  }
  return pms/1000-startRaw-pauseAccum;
}
function look(t=gt){
  if(t<lookStart+LOOK_DUR+COOL)return;
  lookStart=t;
  let tg=null;for(const e of events){const d=e.hit-t;if(!e.done&&e.mem===0&&!e.feint&&d>=-LATE&&d<=LOOK_DUR&&(!tg||e.hit<tg.hit))tg=e}
  if(tg){tg.done=true;tg.okT=gt;success(tg,Math.abs(tg.hit-t)<=PERFECT);return}
  sfx('look');
  popup('スッ…',FACE.x+70,FACE.y-70,'#cfe3ff',18,0.5);
  const realSoon=events.some(e=>!e.done&&e.mem===0&&!e.feint&&e.hit>=t-LATE&&e.hit<=t+LOOK_DUR+0.25);
  if(realSoon)return;
  const f=events.find(e=>!e.done&&!e.flinched&&e.mem===0&&e.feint&&gt>=e.start);
  if(f){f.flinched=true;combo=0;addVolt(-15);sfx('flinch');popup('ビビりすぎ…',FACE.x-120,FACE.y-30,'#9fb0c8',24);setMono('ち、違う、靴紐を見ただけだし',1.6);return}
  const m=events.find(e=>!e.done&&!e.flinched&&e.mem>0&&e.hit>=gt-0.05&&e.hit<=gt+LOOK_DUR+0.3);
  if(m){m.flinched=true;combo=0;addVolt(-15);sfx('flinch');popup('他メンに失礼…',FACE.x-120,FACE.y-30,'#9fb0c8',24);setMono(`（${MEMBERS[m.mem].name}ちゃんのレスから逃げてしまった…）`,1.8)}
}

function success(e,perfect){
  e.res='ok';dodged++;combo++;maxCombo=Math.max(maxCombo,combo);comboT=vt;if(perfect)perfects++;
  score+=Math.round((perfect?200:100)*(1+Math.min(combo,30)*0.05)*(voltMax()?2:1)/10)*10;
  addVolt((perfect?7:4)+Math.min(combo,20)*0.25);
  if(perfect){popup('余裕。',FACE.x-130,FACE.y-40,'#ffe46b',34);sfx('perfect');shake=Math.max(shake,4)}
  else{popup('セーフ',FACE.x-130,FACE.y-40,'#bfe9ff',28);sfx('good')}
  burst(FACE.x,FACE.y-30,6,'spark','#fff',160);
  if(perfect&&R()<0.45)setMono(pick(MONO_PERFECT));
  else if(!perfect&&R()<0.35)setMono(pick(MONO_GOOD));
}
function receive(e){
  e.res='recv';received++;score+=30*(voltMax()?2:1);addVolt(1);sfx('recv');
  const m=MEMBERS[e.mem];
  burst(FACE.x,FACE.y,7,'heart',m.col,140);
  popup(`${m.name}のレス、受け取った`,FACE.x-110,FACE.y+70,m.col,17,0.9);
  if(R()<0.3)setMono(pick(MONO_OTHER));
}

function fail(e){
  e.res='fail';failEvent=e;state='melt';meltT0=gt;musicOn=false;cleared=false;stopSong(1.2);
  const early=lookStart>e.hit-1.2&&lookStart<e.hit&&lookStart+LOOK_DUR<e.hit;
  failReason=early?'下を向くのが早すぎた。顔を上げた瞬間に目が合った。':`推しの${RES[e.type].name}をまともに浴びてしまった。`;
  flash=1;shake=16;sfx('fail');
  try{navigator.vibrate&&navigator.vibrate([70,50,70,50,200])}catch(err){}
  recordBest();
}

// 次の拍の少し手前で、その拍ちょうどに鳴るよう予約する
function scheduleTicks(){
  const nb=Math.ceil((gt-curSeg.t0-curSeg.off)/BEAT-1e-6),tb=T(nb);
  if(nb<=lastTickBeat||tb-gt>0.12)return;
  lastTickBeat=nb;
  let ev=null;for(const e of events)if(!e.done&&e.mem===0&&!(e.feint&&e.revealed)&&tb>=e.start-0.02&&tb<=e.hit+0.02&&(!ev||e.hit<ev.hit))ev=e;
  if(!ev||!ac||ac.state!=='running')return;
  const at=songMode?audioZero+tb:(audioOff===null?ac.currentTime+(tb-gt):audioOff+tb);
  const left=Math.round((ev.hit-tb)/BEAT);
  if(at<ac.currentTime-0.01)return;
  if(left<=0)tone(at,1760,0.12,'square',0.09);
  else tone(at,left===1?1320:990,0.05,'square',0.06);
}
function updatePlay(){
  if(songMode&&updateSongs())return;
  scheduleTicks();
  const lv=dlv();
  if(lv>lastLv){lastLv=lv;popup(`LV ${lv}  レスが加速する`,W/2,L.lvY,'#ff8cc6',26,1.4);sfx('lvup')}
  if(songMode&&mode==='normal'&&!spurt&&gt-curSeg.t0>curSeg.dur*0.7){spurt=true;popup('ラストスパート！レスが激しくなる！',W/2,L.lvY+76,'#ffe46b',24,2.2);sfx('lvup');setMono('…ここからが本番か',1.8)}
  for(let i=1;i<MEMBERS.length;i++)if(!joined[i]&&lv>=MEMBERS[i].lv){
    joined[i]=true;joinT[i]=vt;
    popup(`新メンバー「${MEMBERS[i].name}」加入！`,W/2,L.lvY+38,MEMBERS[i].col,24,1.8);
    setMono(pick(MONO_JOIN),2);
  }
  genOshi();genMembers();
  for(const e of events){
    if(e.done)continue;
    if(!e.played&&gt>=e.start){e.played=true;if(e.mem>0)sfx('tele2')}
    if(e.feint&&!e.revealed&&gt>=e.revealT){e.revealed=true;sfx('feint')}
    if(gt>=e.hit+(e.mem===0&&!e.feint?LATE:0)){
      e.done=true;
      if(e.mem>0){receive(e);continue}
      if(e.feint){
        LUCKY.faint=1;burst(LUCKY.x,LUCKY.y-50,10,'heart','#ff5fa2',150);sfx('lucky');
        popup('うっ♡',LUCKY.x+10,LUCKY.y-80,'#ff8cc6',18,0.8);
        if(!e.flinched){score+=50*(voltMax()?2:1);addVolt(3);popup('見切った',FACE.x-120,FACE.y-30,'#d9c8ff',22,0.8)}
      }else{
        const d=e.hit-lookStart;
        if(d>=-LATE&&d<=LOOK_DUR){e.okT=gt;success(e,Math.abs(d)<=PERFECT)}
        else{fail(e);return}
      }
    }
  }
  events=events.filter(e=>!e.done||gt-e.hit<1.2);
}

function updateMelt(){
  const mt=gt-meltT0;
  if(!meltFx.burst&&mt>0.3){meltFx.burst=true;burst(FACE.x,FACE.y,22,'heart','#ff4f9a',280);flash=Math.max(flash,0.6)}
  if(!meltFx.run&&mt>1.3){meltFx.run=true;shake=10}
  const p=clamp((mt-1.3)/1.5,0,1);
  otPos={x:lerp(L.otX,L.runTo.x,p),y:lerp(L.ground,L.runTo.y,p),s:lerp(1,L.runTo.s,p)};
  if(mt>1.3&&R()<0.3)parts.push({x:otPos.x+40*otPos.s,y:otPos.y-10*otPos.s,vx:120,vy:-40,life:0,max:0.5,kind:'dust',col:'#776',size:10*otPos.s,rot:0});
  if(mt>3.0){state='result';resultVt=vt;onResult()}
}

function scheduleMusic(){
  if(!ac||!musicOn||songMode||paused||ac.state!=='running')return;
  const off=ac.currentTime-gt;
  if(audioOff===null||Math.abs(off-audioOff)>0.08)audioOff=off;else audioOff+=(off-audioOff)*0.02;
  while(nextStep*STEP<gt+0.2){
    const at=audioOff+nextStep*STEP;
    if(at>=ac.currentTime-0.01)playStep(nextStep,Math.max(at,ac.currentTime));
    nextStep++;
  }
}

function pauseGame(){if(state!=='play'||paused)return;paused=true;pausedRaw=rawNow();if(ac)ac.suspend()}
function resumeGame(){if(!paused)return;pauseAccum+=rawNow()-pausedRaw;paused=false;if(ac)ac.resume()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

function press(ts){
  if(!$('bookModal').hidden){$('bookModal').hidden=true;return}
  if(!$('chekiModal').hidden){closeCheki();return}
  if(!$('cardModal').hidden){$('cardModal').hidden=true;return}
  if(state==='title'){startGame('normal');return}
  if(state==='result'){if(vt-resultVt>0.8)startGame(mode);return}
  if(state==='play'){if(paused){resumeGame();return}look(ts!=null&&ac&&(!songMode||ac.state==='running')?Math.min(gt+0.05,Math.max(gt-0.1,songTimeAt(ts))):gt)}
}
function toTitle(){hideResultUI();state='title';joined=[true,false,false,false,false];events=[]}
const hitRect=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
window.addEventListener('keydown',e=>{
  if(state==='title'&&e.code==='KeyC'){startGame('challenge');return}
  if(state==='result'&&(e.code==='KeyT'||e.code==='Escape')){toTitle();return}
  if(['Space','ArrowDown','KeyS','Enter','KeyJ'].includes(e.code)){e.preventDefault();if(!e.repeat)press(e.timeStamp)}
  else if(e.code==='KeyM'){toggleMute()}
  else if(state==='title'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')){e.preventDefault();setOshi((oshiIdx+(e.code==='ArrowLeft'?4:1))%5)}
  else if(e.code==='Escape'||e.code==='KeyP'){paused?resumeGame():pauseGame()}
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'){
    const p=canvasPoint(e),c=selectorCards().find(c=>p.x>=c.x-6&&p.x<=c.x+c.w+6&&p.y>=c.y-10&&p.y<=c.y+c.h+22);
    if(c){setOshi(c.i);return}
    if(hitRect(p,bookRect())){openBook();return}
    const b=titleButtons().find(b=>hitRect(p,b));
    if(b)startGame(b.id);
    return;
  }
  if(state==='result'){
    if(vt-resultVt>0.8){const b=resultButtons().find(b=>hitRect(canvasPoint(e),b));if(b){if(b.id==='again')startGame(mode);else toTitle()}}
    return;
  }
  press(e.timeStamp);
});
document.getElementById('look').addEventListener('pointerdown',e=>{e.preventDefault();press(e.timeStamp)});
muteBtn.addEventListener('click',toggleMute);
cv.addEventListener('contextmenu',e=>e.preventDefault());

// ================= 背景 =================
function drawBG(bt){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#170d29');g.addColorStop(0.6,'#291543');g.addColorStop(1,'#120a1c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const [x,y] of L.speakers){ctx.fillStyle='#120b1a';rrPath(x,y,46,96,4);ctx.fill();ctx.fillStyle='#2a2036';ell(x+23,y+28,13,13);ctx.fill();ell(x+23,y+68,15,15);ctx.fill()}
  g=ctx.createLinearGradient(0,L.floorY,0,H);g.addColorStop(0,'#1d1328');g.addColorStop(1,'#0b0710');
  ctx.fillStyle=g;ctx.fillRect(0,L.floorY,W,H-L.floorY);
  // LEDスクリーン
  const [lx,ly,lw,lh]=L.led;
  g=ctx.createLinearGradient(0,ly,0,ly+lh);g.addColorStop(0,'#3a1150');g.addColorStop(1,'#1f0b33');
  ctx.fillStyle=g;rrPath(lx,ly,lw,lh,8);ctx.fill();ctx.strokeStyle='#0d0716';ctx.lineWidth=5;ctx.stroke();
  ctx.save();rrPath(lx,ly,lw,lh,8);ctx.clip();
  for(let i=0;i<16;i++){const sx=lx+16+(i*97)%(lw-30),sy=ly+14+(i*53)%(lh-28),a=0.3+0.7*Math.abs(Math.sin(bt*0.5+i));
    ctx.fillStyle=`rgba(255,220,250,${a*0.7})`;star(sx,sy,3+(i%3)*1.5,bt*0.2+i);ctx.fill()}
  ctx.globalAlpha=0.9;
  txt('LOVE♡MATSURI',lx+lw/2,ly+52,lw>400?40:31,'#ff9bd0',{font:FD,olw:6,ol:'#5a1048'});
  txt('1st ONE-MAN LIVE',lx+lw/2,ly+84,13,'#ffd6ef');
  ctx.globalAlpha=1;ctx.restore();
  // トラス
  ctx.fillStyle='#3b3546';ctx.fillRect(0,12,L.trussW,10);
  ctx.strokeStyle='#4c4558';ctx.lineWidth=1.5;for(let x=0;x<L.trussW;x+=14){ctx.beginPath();ctx.moveTo(x,12);ctx.lineTo(x+14,22);ctx.stroke()}
  const lc=['#ff5fa2','#7fc8ff','#ffe17a','#c58aff'];
  for(let i=0;i<L.lights;i++){const x=40+i*(L.trussW-80)/(L.lights-1);ctx.fillStyle='#221c2c';rrPath(x-10,20,20,16,4);ctx.fill();ctx.fillStyle=lc[i%4];ell(x,34,7,4);ctx.fill()}
  // ステージ
  const S=L.stage;
  ctx.fillStyle='#3d2c4e';ctx.beginPath();ctx.moveTo(0,S.top);ctx.lineTo(S.w,S.top);ctx.lineTo(S.w+S.lip,S.front);ctx.lineTo(0,S.front);ctx.fill();
  ctx.fillStyle='#160f1f';ctx.fillRect(0,S.front,S.w+S.lip,S.bottom-S.front);
  ctx.strokeStyle='rgba(255,140,200,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,S.front);ctx.lineTo(S.w+S.lip,S.front);ctx.stroke();
  ctx.fillStyle='#0c0812';for(const x of L.monitors){ctx.beginPath();ctx.moveTo(x-26,S.front);ctx.lineTo(x+26,S.front);ctx.lineTo(x+20,S.top+2);ctx.lineTo(x-14,S.top+4);ctx.fill()}
  // 後方の壁（主人公の定位置）
  const [wx,wy,ww,wh]=L.wall;
  ctx.fillStyle='#211729';ctx.fillRect(wx,wy,ww,wh);
  ctx.fillStyle='#17101f';if(L.portrait)ctx.fillRect(wx,wy,ww,8);else ctx.fillRect(wx,wy,10,wh);
  ctx.fillStyle='#120c18';ctx.fillRect(wx,wy+wh-6,ww,10);
  for(const [x,y,w,h,c,rot,kind] of L.posters)drawFlyer(x,y,w,h,c,rot,kind);
  const [ex,ey]=L.exit;
  ctx.fillStyle='rgba(80,255,150,.18)';rrPath(ex-6,ey-6,76,36,8);ctx.fill();
  ctx.fillStyle='#14853f';rrPath(ex,ey,64,24,4);ctx.fill();
  txt('EXIT',ex+32,ey+13,14,'#eafff0');
}

// 壁のチラシ（文字ではなく、絵・色帯・細かい本文の線で「それっぽく」見せる）
function textLines(x,y,w,n,gap,col){ctx.fillStyle=col;for(let k=0;k<n;k++)ctx.fillRect(x,y+k*gap,w*(k%3===2?0.6:k%2?0.82:0.95),1.8)}
function drawFlyer(x,y,w,h,c,rot,kind){
  ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(rot);
  const X=-w/2,Y=-h/2;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(X+3,Y+3,w,h);
  ctx.fillStyle='#efe8dc';ctx.fillRect(X,Y,w,h);
  ctx.save();ctx.beginPath();ctx.rect(X,Y,w,h);ctx.clip();
  if(kind==='live'){
    let g=ctx.createLinearGradient(0,Y,0,Y+h*0.62);g.addColorStop(0,c);g.addColorStop(1,'#2a1644');ctx.fillStyle=g;ctx.fillRect(X,Y,w,h*0.62);
    ctx.fillStyle='rgba(255,255,255,.3)';star(0,Y+h*0.3,w*0.46,0.2);ctx.fill();
    ctx.fillStyle='#1a1220';for(const k of [-1,0,1]){const sx=k*w*0.24,sz=k?0.85:1;ell(sx,Y+h*0.4-6*sz,w*0.07*sz,w*0.07*sz);ctx.fill();rrPath(sx-w*0.08*sz,Y+h*0.4,w*0.16*sz,h*0.22,3);ctx.fill()}
    ctx.fillStyle='#ffe15f';ctx.fillRect(X+4,Y+h*0.66,w-8,h*0.08);ctx.fillStyle='#ff4f9a';ctx.fillRect(X+8,Y+h*0.68,w*0.45,h*0.04);
    textLines(X+5,Y+h*0.8,w-10,3,h*0.06,'rgba(40,30,50,.5)');
  }else if(kind==='goods'){
    ctx.fillStyle=c;ctx.fillRect(X,Y,w,h*0.2);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(X+5,Y+h*0.07,w*0.5,h*0.06);
    const cols=['#ff4f9a','#4fb8ff','#ffd23f','#b77dff'],cw=(w-15)/2;
    cols.forEach((cc,k)=>{const gx=X+5+(k%2)*(cw+5),gy=Y+h*0.25+Math.floor(k/2)*(cw+12);
      ctx.fillStyle='#fff';ctx.fillRect(gx,gy,cw,cw);ctx.fillStyle=cc;
      if(k===0){ell(gx+cw/2,gy+cw/2,cw*0.32,cw*0.32);ctx.fill()}
      else if(k===1){ctx.fillRect(gx+cw*0.15,gy+cw*0.3,cw*0.7,cw*0.4)}
      else if(k===2){ctx.fillRect(gx+cw*0.42,gy+cw*0.1,cw*0.16,cw*0.8)}
      else{heart(gx+cw/2,gy+cw/2,cw*0.28);ctx.fill()}
      ctx.fillStyle='rgba(40,30,50,.55)';ctx.fillRect(gx,gy+cw+3,cw*0.7,1.8)});
  }else if(kind==='taiban'){
    ctx.fillStyle='#231b30';ctx.fillRect(X,Y,w,h);
    ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(X,Y+h*0.12);ctx.lineTo(X+w,Y);ctx.lineTo(X+w,Y+h*0.2);ctx.lineTo(X,Y+h*0.32);ctx.fill();
    const fc=['#ff4f9a','#5fe08a','#ffd23f','#4fb8ff'];
    fc.forEach((cc,k)=>{const fx=X+w*0.2+(k%2)*w*0.6,fy=Y+h*0.45+Math.floor(k/2)*h*0.2;ctx.fillStyle=cc;ell(fx,fy,w*0.15,w*0.15);ctx.fill();ctx.fillStyle='rgba(26,18,32,.6)';ell(fx,fy+2,w*0.07,w*0.08);ctx.fill()});
    ctx.fillStyle='#fff';txt('VS',0,Y+h*0.55,10,'#fff',{font:FD});
    textLines(X+5,Y+h*0.84,w-10,2,h*0.06,'rgba(255,255,255,.5)');

function poseFor(i){
  if(state==='melt'||state==='result')return{pose:i===0?'melt':'idle',k:1};
  if(state!=='play')return{pose:'idle',k:0};
  let act=null;
  for(const e of events){if(e.mem!==i)continue;if(gt>=e.start&&(!e.done||gt-e.hit<0.35)&&(!act||e.hit<act.hit))act=e}

}

  }

  if(state!=='title'&&state!=='loading'&&!paused){const t=songTimeAt(performance.now());gt=state==='play'?Math.max(gt,t):t}
  if(state==='play'&&!paused){updatePlay();scheduleMusic()}
  else if(state==='melt')updateMelt();
  const lookTarget=(state==='play'&&gt>=lookStart&&gt<=lookStart+LOOK_DUR)?1:0;
  lookVis+=(lookTarget-lookVis)*Math.min(1,dt*35);
  if(!paused)updateParts(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
